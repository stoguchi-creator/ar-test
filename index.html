<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR AR TEST</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      padding: 16px 28px;
      border: 0;
      border-radius: 30px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      position: fixed;
      z-index: 9998;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: white;
      font-size: 16px;
      text-shadow: 0 1px 4px black;
    }
  </style>
</head>

<body>

  <div id="message">
    「ARをスタート」を押してQRコードを映してください
  </div>

  <button id="startButton">
    ARをスタート
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets%20(1).mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

      <video
        id="arVideo"
        src="./video.MOV"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#arVideo"
        position="0 0 0.01"
        width="1"
        height="1.7778">
      </a-video>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const scene = document.querySelector("a-scene");
      const target = document.querySelector("#target");
      const video = document.querySelector("#arVideo");
      const button = document.querySelector("#startButton");
      const message = document.querySelector("#message");

      button.addEventListener("click", async () => {

        try {

          // iPhoneで動画再生を許可させるため、一度再生を試す
          await video.play();
          video.pause();
          video.currentTime = 0;

          // MindARスタート
          await scene.systems["mindar-image-system"].start();

          button.style.display = "none";
          message.textContent = "QRコードをカメラに映してください";

        } catch (error) {

          console.error(error);
          message.textContent = "ARを開始できませんでした";

        }

      });


      target.addEventListener("targetFound", () => {

        message.textContent = "QRコードを認識しました！";

        video.currentTime = 0;

        video.play().catch(error => {
          console.error(error);
        });

      });


      target.addEventListener("targetLost", () => {

        message.textContent = "QRコードをカメラに映してください";

        video.pause();

      });

    });
  </script>

</body>
</html>
