<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR TEST</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      padding: 16px 28px;
      border: 0;
      border-radius: 30px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      position: fixed;
      z-index: 9998;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: white;
      font-size: 16px;
      text-shadow: 0 1px 4px #000;
    }
  </style>
</head>

<body>

  <div id="message">
    ARをスタートしてください
  </div>

  <button id="startButton">
    ARをスタート
  </button>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets>
      <video
        id="arVideo"
        src="./video.MOV"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <a-video
        src="#arVideo"
        position="0 0 0.01"
        width="1"
        height="1.7778"
      ></a-video>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const targetEl = document.querySelector("#target");
      const videoEl = document.querySelector("#arVideo");
      const buttonEl = document.querySelector("#startButton");
      const messageEl = document.querySelector("#message");

      buttonEl.addEventListener("click", async () => {
        try {
          await videoEl.play();
          videoEl.pause();
          videoEl.currentTime = 0;

          await sceneEl.systems["mindar-image-system"].start();

          buttonEl.style.display = "none";
          messageEl.textContent = "ターゲット画像を映してください";
        } catch (error) {
          console.error(error);
          messageEl.textContent = "ARの開始に失敗しました";
        }
      });

      targetEl.addEventListener("targetFound", () => {
        messageEl.textContent = "認識しました！";
        videoEl.currentTime = 0;

        videoEl.play().catch(error => {
          console.error(error);
        });
      });

      targetEl.addEventListener("targetLost", () => {
        messageEl.textContent = "ターゲット画像を映してください";
        videoEl.pause();
      });
    });
  </script>

</body>
</html>
